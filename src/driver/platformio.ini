; PlatformIO project configuration for the Claude Usage LED Indicator
; firmware. Two environments are defined:
;   - esp32dev : on-device build for the ESP32-WROOM-32 board.
;   - native   : host-side build for the unit-test layer in test/test_logic.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -std=gnu++17
lib_deps =
    fastled/FastLED@^3.6
    bblanchon/ArduinoJson@^7
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
; The three color macros are provided via -include of a small header so we
; don't have to shell-quote CRGB(...) literals into -D flags. See
; test/test_logic/test_color_defaults.h.
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Itest/test_logic
    -include test/test_logic/test_color_defaults.h
test_build_src = yes
build_src_filter = +<Animations.cpp> +<DisplayController.cpp>
test_ignore = test_embedded*
